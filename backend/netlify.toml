# API do eCheck no Netlify (site echeck-rotexmaquinas-api).
# A API inteira roda como uma função (netlify/functions/api.ts); todas as rotas vão para ela.
[build]
  command = "npm run typecheck"
  publish = "netlify/publico"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
